<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Games · Spatium</title>

    <meta
        name="description"
        content="Play games on Spatium."
    >

    <link
        rel="icon"
        href="./assets/favicon.svg"
    >

    <!-- IMPORTANT: CSS is inside /css/ -->
    <link
        rel="stylesheet"
        href="./css/games.css"
    >
</head>

<body>

    <!-- =========================
         NAVIGATION
    ========================== -->

    <header class="topbar">

        <a
            class="brand"
            href="./index.html"
        >
            Spatium
        </a>

        <nav class="nav">

            <a href="./index.html">
                Home
            </a>

            <a
                href="./games.html"
                class="active"
            >
                Games
            </a>

            <a href="./chat.html">
                Chat
            </a>

        </nav>

    </header>


    <!-- =========================
         PAGE
    ========================== -->

    <main class="games-page">

        <!-- Hero -->

        <section class="hero">

            <div class="gradient-bg"></div>

            <h1>
                Play anything.
            </h1>

            <p>
                Browse the Spatium game library.
            </p>

            <div class="search-area">

                <div class="search-box">

                    <span class="search-symbol">
                        ⌕
                    </span>

                    <input
                        id="game-search"
                        type="text"
                        placeholder="Search games..."
                        autocomplete="off"
                    >

                    <button
                        id="clear-search"
                        class="clear-search"
                        type="button"
                        aria-label="Clear search"
                    >
                        ×
                    </button>

                </div>

                <select id="game-sort">

                    <option value="az">
                        A → Z
                    </option>

                    <option value="za">
                        Z → A
                    </option>

                </select>

            </div>

        </section>


        <!-- =========================
             GAMES
        ========================== -->

        <section class="library">

            <div class="library-header">

                <h2>
                    All Games
                </h2>

                <span id="game-count">
                    Loading...
                </span>

            </div>


            <div
                id="loading"
                class="loading"
            >

                <div class="loader"></div>

                <div class="loading-text">
                    Loading games...
                </div>

            </div>


            <div
                id="game-grid"
                class="game-grid"
            ></div>


            <div
                id="empty-state"
                class="empty-state"
            >

                <h3>
                    No games found
                </h3>

                <p>
                    Try searching for something else.
                </p>

            </div>


            <div
                id="error-state"
                class="error-state"
            >

                <h3>
                    Unable to load games
                </h3>

                <p>
                    Check that games/games.json exists.
                </p>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <span>
            © <span id="current-year"></span> Spatium
        </span>

    </footer>


    <!-- IMPORTANT:
         JS is inside /js/
    -->

    <script src="./js/games.js"></script>

</body>
</html>
