<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0e0e0e">

    <title>Games · Spatium</title>
    <meta
        name="description"
        content="Browse and play games on Spatium."
    >

    <link rel="icon" href="./assets/favicon.svg">
    <link rel="stylesheet" href="./css/games.css">
</head>

<body>

<header class="topbar">
    <div class="nav-inner">

        <a class="brand" href="./index.html">
            <span class="brand-icon">S</span>
            <span>Spatium</span>
        </a>

        <nav class="nav-links">
            <a href="./index.html">Home</a>
            <a href="./games.html" class="active">Games</a>
            <a href="./chat.html">Chat</a>
            <a href="./account.html">Account</a>
        </nav>

    </div>
</header>


<main class="games-page">

    <section class="games-header">

        <div>
            <div class="eyebrow">SPATIUM</div>

            <h1>Games</h1>

            <p class="subtitle">
                Pick a game and start playing.
            </p>
        </div>

        <div id="gameCount" class="games-meta">
            Loading games...
        </div>

    </section>


    <section class="search-section">

        <label class="search-box">

            <span class="search-icon">⌕</span>

            <input
                id="gameSearch"
                type="search"
                placeholder="Search games..."
                autocomplete="off"
                spellcheck="false"
            >

            <button
                id="clearSearch"
                class="clear-search"
                type="button"
                aria-label="Clear search"
            >
                ×
            </button>

        </label>

    </section>


    <section
        id="gamesGrid"
        class="games-grid"
        aria-live="polite"
    ></section>


    <section
        id="emptyState"
        class="empty-state"
        hidden
    >
        <h2>No games found</h2>
        <p>Try a different search.</p>
    </section>


    <section
        id="errorState"
        class="error-state"
        hidden
    >
        <h2>Could not load games</h2>

        <p>
            Make sure <code>games.json</code> is in the root of Spatium.
        </p>

        <button id="retryButton" type="button">
            Retry
        </button>
    </section>

</main>


<script src="./js/games.js"></script>

</body>
</html>
