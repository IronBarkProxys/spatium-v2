<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Games · Spatium</title>

    <link rel="stylesheet" href="./css/games.css">
</head>

<body>

    <div class="page">

        <header class="topbar">

            <a href="./index.html" class="logo">
                Spatium
            </a>

            <nav>
                <a href="./index.html">Home</a>
                <a href="./games.html" class="active">Games</a>
                <a href="./chat.html">Chat</a>
            </nav>

        </header>


        <main>

            <section class="hero">

                <div class="glow"></div>

                <h1>Play anything.</h1>

                <p>
                    Browse the Spatium game library.
                </p>

                <div class="controls">

                    <div class="search">

                        <span>⌕</span>

                        <input
                            id="search"
                            type="text"
                            placeholder="Search games..."
                            autocomplete="off"
                        >

                        <button
                            id="clear"
                            type="button"
                        >
                            ×
                        </button>

                    </div>

                    <select id="sort">

                        <option value="az">
                            A → Z
                        </option>

                        <option value="za">
                            Z → A
                        </option>

                    </select>

                </div>

            </section>


            <section class="library">

                <div class="library-top">

                    <h2>All Games</h2>

                    <span id="count">
                        0 games
                    </span>

                </div>


                <div
                    id="games"
                    class="games"
                ></div>


                <div
                    id="empty"
                    class="empty"
                >
                    <h2>No games found</h2>
                    <p>Try another search.</p>
                </div>

            </section>

        </main>


        <footer>
            Spatium · <span id="year"></span>
        </footer>

    </div>


    <script src="./js/games.js"></script>

</body>
</html>
