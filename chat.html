<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">

    <title>Chat · Spatium GameVault</title>

    <meta
        name="description"
        content="Chat with the Spatium community in GameVault style."
    >

    <link rel="icon" href="assets/favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/chat.css">
</head>

<body>

<div class="chat-page">

    <!-- CHAT -->
    <div
        class="gv-chat gv-chat-full gv-chat-in"
        role="dialog"
        aria-label="Chat"
    >

        <div class="gv-chat-frame">

            <!-- SIDEBAR -->
            <aside
                class="gv-chat-side"
                id="chatSidebar"
            >

                <div class="gv-chat-side-head">

                    <span>Chats</span>

                    <button
                        class="gv-chat-icon"
                        type="button"
                        aria-label="Pop-ups over games are on"
                        title="Pop-ups over games are on"
                    >
                        <svg
                            width="15"
                            height="15"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
                            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
                        </svg>
                    </button>

                </div>


                <div class="gv-chat-list">

                    <button
                        class="gv-chat-row"
                        type="button"
                        aria-current="true"
                    >

                        <span class="gv-chat-dot">
                            #
                        </span>

                        <span class="gv-chat-row-text">

                            <span class="gv-chat-row-name">
                                Server
                            </span>

                            <span
                                class="gv-chat-row-last"
                                id="sidebarLastMsg"
                            >
                                Talk with everyone on Spatium
                            </span>

                        </span>

                        <span
                            class="gv-chat-count"
                            hidden
                        ></span>

                    </button>

                </div>


                <div class="gv-chat-foot">

                    <button
                        class="gv-chat-pill primary"
                        type="button"
                        id="composeBtn"
                    >
                        Compose
                    </button>

                    <button
                        class="gv-chat-pill"
                        type="button"
                        id="groupChatBtn"
                    >
                        Group chat
                    </button>

                </div>

            </aside>


            <!-- MAIN CHAT -->
            <section class="gv-chat-main">

                <!-- CHAT HEADER -->
                <div class="gv-chat-head">

                    <button
                        class="gv-chat-icon"
                        type="button"
                        aria-label="Mute"
                        title="Mute"
                    >
                        <svg
                            width="15"
                            height="15"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
                            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
                        </svg>
                    </button>


                    <div class="gv-chat-title">

                        <b>Server</b>

                        <small>
                            Everyone on Spatium
                        </small>

                    </div>


                    <!-- ONLY EXIT BUTTON -->
                    <button
                        class="gv-chat-icon gv-chat-close"
                        id="closeChatBtn"
                        type="button"
                        aria-label="Close chat"
                        title="Close chat"
                    >
                        ×
                    </button>

                </div>


                <!-- CHAT LOG -->
                <div
                    class="gv-chat-log"
                    id="messages"
                    role="log"
                    aria-live="polite"
                >

                    <!-- Messages are loaded by JavaScript -->

                </div>


                <!-- COMPOSER -->
                <div class="composer-wrapper">

                    <div
                        class="mention-list"
                        id="mentionList"
                    ></div>


                    <div class="composer">

                        <textarea
                            id="messageInput"
                            maxlength="300"
                            placeholder="Type a message..."
                            rows="1"
                            autocomplete="off"
                            spellcheck="true"
                            aria-label="Message"
                        ></textarea>


                        <div class="composer-bottom">

                            <span id="characterCount">
                                0 / 300
                            </span>

                            <button
                                id="sendButton"
                                type="button"
                            >
                                Send
                            </button>

                        </div>

                    </div>

                </div>

            </section>

        </div>

    </div>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- SUPABASE CONFIG -->
<script
    src="js/supabase-config.js"
    onerror="console.log('Supabase config omitted, local persistence mode active')"
></script>


<script>
document.addEventListener("DOMContentLoaded", () => {

    const messageInput =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const characterCount =
        document.getElementById("characterCount");

    const messagesContainer =
        document.getElementById("messages");

    const sidebarLastMsg =
        document.getElementById("sidebarLastMsg");

    const closeChatBtn =
        document.getElementById("closeChatBtn");


    /*
    ============================================================
    CONFIG
    ============================================================
    */

    const STORAGE_KEY = "spatium_server_chat_messages";


    /*
    ============================================================
    DEFAULT MESSAGES
    ============================================================
    */

    const defaultMessages = [
        {
            id: 378,
            username: "chezwhell",
            message: "wait r u amargoyal",
            time: "2026-10-02T17:03:50.008736+00:00"
        },
        {
            id: 379,
            username: "Fil",
            verified: true,
            message: "half of the time the scramjet doesn't work",
            time: "2026-10-02T17:04:19.075084+00:00"
        },
        {
            id: 381,
            username: "chezwhell",
            message: "fil it gotta be on guest network",
            time: "2026-10-02T17:04:49.355415+00:00"
        },
        {
            id: 384,
            username: "xyyz",
            message: "is @fil or @xyz Amar goyal",
            time: "2026-10-02T17:15:48.816457+00:00"
        },
        {
            id: 385,
            username: "Fil",
            verified: true,
            message: "I'm Filip bruh",
            time: "2026-10-02T17:16:07.153211+00:00"
        },
        {
            id: 390,
            username: "dbivol",
            message: "@xyz checking out the new GameVault layout style!",
            time: "2026-10-02T17:30:09.37922+00:00"
        },
        {
            id: 420,
            username: "xyz",
            verified: true,
            message: "hello everyone! welcome to the Spatium chat",
            time: "2026-10-02T18:51:49.960258+00:00"
        }
    ];


    /*
    ============================================================
    LOAD SAVED MESSAGES
    ============================================================
    */

    function loadMessages() {

        try {

            const saved =
                localStorage.getItem(STORAGE_KEY);

            if (saved) {

                const parsed =
                    JSON.parse(saved);

                if (Array.isArray(parsed)) {
                    return parsed;
                }

            }

        } catch (error) {

            console.error(
                "Could not load saved messages:",
                error
            );

        }

        return defaultMessages;

    }


    /*
    ============================================================
    SAVE MESSAGES
    ============================================================
    */

    function saveMessages() {

        try {

            const messages = [];

            document
                .querySelectorAll(".gv-msg")
                .forEach(msg => {

                    const username =
                        msg
                            .querySelector(".gv-msg-name")
                            ?.textContent
                            .trim() || "You";

                    const body =
                        msg
                            .querySelector(".gv-msg-body")
                            ?.textContent
                            .trim() || "";

                    const time =
                        msg
                            .querySelector(".gv-msg-time")
                            ?.getAttribute("datetime") ||
                        new Date().toISOString();

                    const id =
                        msg.getAttribute("data-id") ||
                        Date.now();

                    messages.push({
                        id,
                        username,
                        message: body,
                        time
                    });

                });


            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(messages)
            );

        } catch (error) {

            console.error(
                "Could not save messages:",
                error
            );

        }

    }


    /*
    ============================================================
    FORMAT MESSAGE
    ============================================================
    */

    function formatMessage(text) {

        const escaped =
            text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");


        return escaped.replace(
            /@(\w+)/g,
            '<button class="gv-mention" type="button">@$1</button>'
        );

    }


    /*
    ============================================================
    DISPLAY MESSAGE
    ============================================================
    */

    function renderMessage(msg) {

        const msgEl =
            document.createElement("div");

        msgEl.className =
            "gv-msg";

        msgEl.setAttribute(
            "data-id",
            msg.id
        );


        const date =
            new Date(msg.time);


        const timeStr =
            date.toLocaleTimeString([], {
                hour: "numeric",
                minute: "2-digit"
            });


        const verified =
            msg.verified
                ? `
                    <svg
                        class="gv-chat-check"
                        viewBox="0 0 24 24"
                        role="img"
                        aria-label="Verified"
                    >
                        <circle
                            cx="12"
                            cy="12"
                            r="11"
                            fill="#1d9bf0"
                        ></circle>

                        <path
                            d="M7 12.5l3.2 3.2L17 9"
                            fill="none"
                            stroke="#fff"
                            stroke-width="2.6"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        ></path>
                    </svg>
                `
                : "";


        msgEl.innerHTML = `
            <div class="gv-msg-head">

                <button
                    class="gv-msg-name"
                    type="button"
                >
                    ${escapeHTML(msg.username)}
                </button>

                ${verified}

                <time
                    class="gv-msg-time"
                    datetime="${escapeHTML(msg.time)}"
                >
                    ${timeStr}
                </time>

                <button
                    class="gv-msg-report"
                    type="button"
                >
                    Report
                </button>

            </div>

            <div class="gv-msg-body">
                ${formatMessage(msg.message)}
            </div>
        `;


        messagesContainer.appendChild(msgEl);

    }


    /*
    ============================================================
    ESCAPE HTML
    ============================================================
    */

    function escapeHTML(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /*
    ============================================================
    INITIALIZE CHAT
    ============================================================
    */

    function initializeChat() {

        const savedMessages =
            loadMessages();


        messagesContainer.innerHTML = "";


        savedMessages.forEach(
            renderMessage
        );


        if (savedMessages.length > 0) {

            const last =
                savedMessages[
                    savedMessages.length - 1
                ];

            sidebarLastMsg.textContent =
                `${last.username}: ${last.message}`;

        }


        scrollToBottom();

    }


    /*
    ============================================================
    SCROLL
    ============================================================
    */

    function scrollToBottom() {

        requestAnimationFrame(() => {

            messagesContainer.scrollTop =
                messagesContainer.scrollHeight;

        });

    }


    /*
    ============================================================
    SEND MESSAGE
    ============================================================
    */

    function sendMessage() {

        const text =
            messageInput.value.trim();


        if (!text) return;


        const now =
            new Date();


        const msg = {

            id:
                Date.now(),

            username:
                "You",

            message:
                text,

            time:
                now.toISOString()

        };


        renderMessage(msg);


        messageInput.value = "";

        messageInput.style.height =
            "auto";


        characterCount.textContent =
            "0 / 300";


        sidebarLastMsg.textContent =
            `You: ${text}`;


        saveMessages();

        scrollToBottom();

    }


    /*
    ============================================================
    CHARACTER COUNT
    ============================================================
    */

    messageInput.addEventListener(
        "input",
        () => {

            const length =
                messageInput.value.length;


            characterCount.textContent =
                `${length} / 300`;


            messageInput.style.height =
                "auto";


            messageInput.style.height =
                Math.min(
                    messageInput.scrollHeight,
                    120
                ) + "px";

        }
    );


    /*
    ============================================================
    ENTER TO SEND
    ============================================================
    */

    messageInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    /*
    ============================================================
    SEND BUTTON
    ============================================================
    */

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    /*
    ============================================================
    REPORT BUTTON
    ============================================================
    */

    messagesContainer.addEventListener(
        "click",
        event => {

            if (
                event.target.classList.contains(
                    "gv-msg-report"
                )
            ) {

                event.target.textContent =
                    "Reported";

                event.target.style.color =
                    "var(--gv-green)";

                event.target.disabled =
                    true;

            }

        }
    );


    /*
    ============================================================
    CLOSE CHAT
    ============================================================
    */

    closeChatBtn.addEventListener(
        "click",
        () => {

            /*
             * Change this to whatever page should open
             * when the user clicks X.
             */

            window.location.href =
                "index.html";

        }
    );


    /*
    ============================================================
    COMPOSE BUTTON
    ============================================================
    */

    document
        .getElementById("composeBtn")
        ?.addEventListener(
            "click",
            () => {

                messageInput.focus();

            }
        );


    /*
    ============================================================
    GROUP CHAT
    ============================================================
    */

    document
        .getElementById("groupChatBtn")
        ?.addEventListener(
            "click",
            () => {

                alert(
                    "Group chats are coming soon."
                );

            }
        );


    /*
    ============================================================
    START
    ============================================================
    */

    initializeChat();

});
</script>

</body>
</html>
